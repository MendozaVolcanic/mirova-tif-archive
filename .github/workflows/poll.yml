name: Poll MIROVA TIF/KMZ

# Triggers:
#  - schedule (NATIVO, agregado S103 2026-06-07): respaldo durable. El polling
#    lo disparaba cron-job.org cada 5 min via la API de workflow_dispatch; ese
#    trigger externo murio el 2026-05-20 y el archivo quedo congelado sin que se
#    notara. El schedule nativo no depende de un servicio externo. GitHub puede
#    correrlo tarde en picos de carga, pero para validacion R2 (TIF +-90min de
#    una deteccion) cada ~30 min alcanza. cron-job.org puede convivir si se revive.
#    NOTA: MIROVA SOBRESCRIBE sus TIF en cada pasada -> el polling solo captura
#    hacia adelante; el historico previo a la reactivacion es irrecuperable.
#  - workflow_dispatch: corrida manual / trigger externo (cron-job.org).
# A43: key quoteada como "on" para evitar el "Norway problem" de YAML 1.1.
"on":
  schedule:
    - cron: "*/30 * * * *"  # cada 30 min (respaldo nativo)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no file writes)"
        required: false
        default: "false"

# S133 — SIN grupo de concurrencia, y es deliberado.
#
# Lo que pasaba con el grupo: GitHub mantiene UNA sola corrida pendiente por grupo, asi
# que cuando una corrida quedaba encolada (por falta de runners o porque la anterior
# seguia viva), el disparo siguiente la DESPLAZABA. Con cron-job.org disparando cada
# 5 min el poller se canibalizaba: 198 de las ultimas 200 corridas terminaron
# `cancelled` y CERO en success, sin un solo commit entre el 2026-09-02 y el 2026-09-04.
#
# Por que eso es grave y no una molestia: MIROVA SOBRESCRIBE su imagen "Last" en cada
# pasada. Una captura que no se toma no se puede tomar despues — se pierde para siempre.
# El TIF de la anomalia de 4,75 MW de Villarrica del 2026-09-04 07:50 se perdio asi.
#
# Por que es seguro quitarlo: el paso de push YA es a prueba de carreras (pull --rebase
# + reintentos con backoff, y falla ruidosamente si no logra publicar). El grupo no
# estaba protegiendo nada que el push no proteja mejor; solo estaba matando corridas.
# Es el mismo patron que VRP Chile documenta: o grupo compartido, o bucle de reintento
# propio, nunca los dos.

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    # S133 — 25 min, no 10. El timeout estaba POR DEBAJO de la duracion tipica.
    # Medido sobre las 100 ultimas corridas exitosas: mediana 12,3 min, p90 14,6 min,
    # maximo 15,0 min. Con el reloj en 10 la mayoria de las corridas estaba condenada
    # de antemano: se las mataba a mitad de camino y GitHub las reporta 'cancelled',
    # que se lee como problema de concurrencia y no como lo que era.
    # Sintoma: ninguna corrida exitosa desde el 2026-08-27. Los pocos commits
    # posteriores son de corridas que alcanzaron a empujar ANTES del hachazo.
    # Regla A15: timeout >= duracion_esperada x 1,3 -> 15 x 1,3 = 19,5; se toma 25
    # por margen, porque los runners vienen mas lentos desde fines de agosto.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full history-less but with auth so we can push.
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: polling/requirements.txt

      - name: Install deps
        run: pip install -r polling/requirements.txt

      - name: Run polling
        id: poll
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python polling/poll.py --dry-run
          else
            python polling/poll.py
          fi

      - name: Commit + push if changes
        run: |
          git config user.name "mirova-tif-bot"
          git config user.email "mirova-tif-bot@users.noreply.github.com"

          # Stage everything under data/ and both indexes.
          git add data/ index.csv index_png.csv 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          # Pull-rebase to avoid race when multiple runs happen close in time.
          git pull --rebase -X theirs origin main || true

          NEW=$(git diff --staged --name-only data/ | wc -l | tr -d ' ')
          git commit -m "poll: ${NEW} new MIROVA snapshot(s) [skip ci]"

          # Retry push on race. S133: 5 intentos con backoff en vez de 3 a secas.
          # Al quitar el grupo de concurrencia varias corridas pueden empujar casi a la
          # vez, asi que el reintento pasa a ser la UNICA defensa contra la carrera y
          # conviene que aguante mas. El backoff evita que dos corridas reintenten
          # sincronizadas y vuelvan a chocar.
          pushed=0
          for i in 1 2 3 4 5; do
            if git push origin main; then
              pushed=1
              break
            fi
            echo "push failed, attempt $i; rebasing and retrying"
            sleep $(( i * 3 ))
            git pull --rebase -X theirs origin main
          done

          # S104: agotar los 3 intentos NO puede terminar en verde. El commit
          # queda solo en el runner (efimero) y el dato nunca se publica; el
          # workflow reportaria success y nadie recibe mail -> pipeline zombie,
          # peor que el fallo original porque es silencioso.
          if [ "$pushed" -ne 1 ]; then
            echo "::error::Push a origin/main fallo tras 5 intentos. El commit local NO se publico y se pierde con el runner."
            exit 1
          fi
