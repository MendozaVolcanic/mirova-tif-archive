name: Poll MIROVA TIF/KMZ

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no file writes)"
        required: false
        default: "false"

# Allow only one polling run at a time. Newer runs cancel older queued ones —
# we don't want to stack pending runs if mirovaweb.it is slow.
concurrency:
  group: poll
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full history-less but with auth so we can push.
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: polling/requirements.txt

      - name: Install deps
        run: pip install -r polling/requirements.txt

      - name: Run polling
        id: poll
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python polling/poll.py --dry-run
          else
            python polling/poll.py
          fi

      - name: Commit + push if changes
        run: |
          git config user.name "mirova-tif-bot"
          git config user.email "mirova-tif-bot@users.noreply.github.com"

          # Stage everything under data/ and both indexes.
          git add data/ index.csv index_png.csv 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          # Pull-rebase to avoid race when multiple runs happen close in time.
          git pull --rebase -X theirs origin main || true

          NEW=$(git diff --staged --name-only data/ | wc -l | tr -d ' ')
          git commit -m "poll: ${NEW} new MIROVA snapshot(s) [skip ci]"

          # Retry push on race.
          for i in 1 2 3; do
            if git push origin main; then
              break
            fi
            echo "push failed, attempt $i; rebasing and retrying"
            git pull --rebase -X theirs origin main
          done
